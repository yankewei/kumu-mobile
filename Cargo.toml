[package]
name = "nsh-app-kumu"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
env_logger = "0.11"
futures-util = "0.3"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
nsh-base = "0.5.0"
nsh-core = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "ios")'.dependencies]
# netwatch/netdev do not compile for iOS with libc 0.2.191.
libc = "=0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }
